<title>인권교육 특별展 시설 안내</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: hotel-lobby directory — a floor stack on the left drives a simplified floor plan and the room list for that floor. */
:root{
  --bg:#FBF7EF; --surface:#FFFFFF; --ink:#24302D; --muted:#66706B; --line:#E3DCCD;
  --orange:#E16824; --teal:#1A998E; --yellow:#F2B935; --green:#6FAF7E; --slate:#9AA39E;
  --c-exhibit:#F3A577; --c-video:#7FC7BE; --c-activity:#F7D77B; --c-rest:#B9DDB8; --c-staff:#E4E1D9; --c-core:#CFD8E3; --c-hall:#FFF1DE;
  --plan-wall:#3B4743; --plan-bg:#FFFFFF; --label:#24302D;
  --display:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151B19; --surface:#1E2623; --ink:#ECEFEA; --muted:#A3ADA7; --line:#33403B;
  --c-exhibit:#B8653C; --c-video:#2E7F76; --c-activity:#A88A34; --c-rest:#4E7F59; --c-staff:#3A423E; --c-core:#3B4757; --c-hall:#3A3226;
  --plan-wall:#C9D3CE; --plan-bg:#1B2220; --label:#F4F6F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B19; --surface:#1E2623; --ink:#ECEFEA; --muted:#A3ADA7; --line:#33403B;
  --c-exhibit:#B8653C; --c-video:#2E7F76; --c-activity:#A88A34; --c-rest:#4E7F59; --c-staff:#3A423E; --c-core:#3B4757; --c-hall:#3A3226;
  --plan-wall:#C9D3CE; --plan-bg:#1B2220; --label:#F4F6F2; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-bottom:22px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--orange)}
h1{margin:4px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
/* floor directory */
.dir{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:860px){.dir{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.floor-btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);min-width:200px}
.floor-btn:hover{border-color:var(--teal)}
.floor-btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.floor-btn[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.floor-btn .fl{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:-.03em}
.floor-btn .sum{font-size:13px;line-height:1.45}
.floor-btn .sum strong{display:block;font-family:var(--display);font-size:15px;font-weight:800}
.dir .note{font-size:12.5px;color:var(--muted);padding:6px 4px;line-height:1.55}
@media (max-width:860px){.dir .note{display:none}}
@media (max-width:860px){.floor-btn{min-width:168px;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:10px 12px}.floor-btn .fl{font-size:24px}.floor-btn .sum{font-size:12px}.floor-btn .sum strong{font-size:14px}}
/* plan */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:12px}
.panel-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em}
.panel-head p{margin:0;color:var(--muted);font-size:14px}
.plan-box{overflow-x:auto;border-radius:12px;background:var(--plan-bg)}
.plan-box svg{display:block;width:100%;min-width:560px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
/* rooms */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px}
.room{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.room.hl{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset}
.room-top{display:flex;align-items:center;gap:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:14px;color:#24302D}
.room h3{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.3}
.orig{font-size:12.5px;color:var(--muted)}
.chip{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.room p{margin:2px 0 0;font-size:14px;color:var(--ink)}
.renamed{color:var(--orange);font-weight:700}
.amen{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.amen div{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px}
.amen b{font-family:var(--display);font-weight:800}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
svg .room-shape{cursor:pointer;transition:filter .15s}
svg .room-shape:hover{filter:brightness(1.05)}
svg .room-shape:focus{outline:none}
svg .room-shape:focus-visible{outline:none;stroke:var(--orange);stroke-width:.25}
svg .hatch{pointer-events:none}
svg text{font-family:var(--display);fill:var(--label);pointer-events:none}
@media (prefers-reduced-motion:reduce){svg .room-shape{transition:none}}

/* detail sheet */
.more-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.more-btn:hover{text-decoration:underline}
.more-btn{all:unset;cursor:pointer;margin-top:auto;padding-top:6px;font-size:13px;font-weight:700;color:var(--teal)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,22,20,.55);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.photo{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg);border-radius:20px 20px 0 0;overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:14px;text-align:center;padding:16px}
.photo .ph svg{width:64px;height:64px}
.photo .tag{position:absolute;left:16px;top:16px;font-family:var(--display);font-weight:900;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink)}
.sheet-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px}
.sheet-body h3{margin:0;font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:-.02em;line-height:1.2}
.sheet-body .orig{font-size:13.5px}
.sheet-body p{margin:0;font-size:15px;line-height:1.75}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.facts dt{color:var(--muted);font-weight:700}
.facts dd{margin:0}
.tips{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sheet-close{all:unset;cursor:pointer;position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sheet-close:focus-visible{outline:3px solid var(--orange)}
.sheet-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.sheet-nav button{all:unset;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--teal);padding:6px 0}
.sheet-nav button:focus-visible{outline:2px solid var(--orange)}

.gal-btn{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.gal-btn:focus-visible{outline:3px solid var(--orange)}
.gal-prev{left:14px}.gal-next{right:14px}
.gal-count{position:absolute;right:16px;bottom:14px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;padding:12px 24px 0;overflow-x:auto}
.thumb{all:unset;cursor:pointer;flex:none;width:72px;height:48px;border-radius:8px;overflow:hidden;background:var(--bg);border:2px solid transparent;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--orange)}
.thumb:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.photo{touch-action:pan-y}

.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.edit-btn{all:unset;cursor:pointer;flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line,#d8d2c4);font-size:14px;font-weight:700;color:var(--ink)}
.edit-btn:hover{background:rgba(0,0,0,.05)}.edit-btn:focus-visible{outline:3px solid var(--orange)}
.sheet-close.static{position:static;flex:none;box-shadow:none;border:1.5px solid var(--line,#d8d2c4)}
.sheet-body.edit label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--muted,#6b6258)}
.sheet-body.edit input:not([type=file]),.sheet-body.edit textarea{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line,#d8d2c4);background:var(--surface);color:var(--ink);resize:vertical}
.sheet-body.edit input:focus,.sheet-body.edit textarea:focus{outline:none;border-color:var(--orange)}
.sheet-body.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.sheet-body.edit .two{grid-template-columns:1fr}}
.eyebrow{font-size:12px;font-weight:700;color:var(--orange);letter-spacing:.04em}
.ph-label{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--muted,#6b6258)}
.e-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.e-ph{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#eee}
.e-ph img{width:100%;height:100%;object-fit:cover;display:block}
.e-ph-tools{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.e-ph-tools button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:#fff;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.45)}
.e-ph-tools button[disabled]{opacity:.3;cursor:default}
.e-empty{font-size:14px;color:var(--muted,#6b6258);padding:8px 0}
.sheet-body.edit label.upload{display:block;margin-top:10px;padding:14px;border:2px dashed var(--line,#d8d2c4);border-radius:12px;text-align:center;cursor:pointer;color:var(--ink);font-size:14px}
.sheet-body.edit label.upload input{position:absolute;opacity:0;width:1px;height:1px}
.sheet-body.edit label.upload:focus-within{border-color:var(--orange)}
.sheet-body.edit label.upload.off{opacity:.5;cursor:not-allowed}
.e-status{min-height:20px;margin-top:12px;font-size:14px;color:var(--muted,#6b6258)}
.e-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.e-actions button{all:unset;cursor:pointer;padding:11px 22px;border-radius:999px;font-weight:700;font-size:15px}
.e-actions .ghost{border:1.5px solid var(--line,#d8d2c4);color:var(--ink)}
.e-actions .primary{background:var(--ink);color:var(--surface)}
.e-actions button[disabled]{opacity:.5;cursor:default}
.e-actions button:focus-visible{outline:3px solid var(--orange)}
.edit-note{margin-top:10px;font-size:13px;color:var(--orange);font-weight:700}
.auth-bar{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.link-btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link-btn:focus-visible{outline:3px solid var(--orange);border-radius:4px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">인권교육 특별展 · 2026. 11. 20. – 12. 05.</div>
      <h1>시설 안내</h1>
    </div>
    <div class="meta">
      <span>장소</span><b>한국SGI 서제주희망문화회관</b>

  <div class="layout">
    <nav class="dir" id="dir" role="tablist" aria-label="층 선택"></nav>
    <main>
      <section class="panel" aria-live="polite">
        <div class="panel-head"><h2 id="floorTitle"></h2><p id="floorSub"></p></div>
        <div class="plan-box"><svg id="plan" role="img" aria-label="층별 안내도"></svg></div>
        <div class="legend" id="legend"></div>
      </section>
      <div class="rooms" id="rooms"></div>
      <div class="amen" id="amen"></div>
      <div class="sheet-bg" id="sheetBg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div></div>
    </main>
  </div>
  <footer>건축 도면(지상 1~3층 평면도)을 단순화한 안내도입니다. 실의 크기와 위치는 실제와 조금 다를 수 있습니다. 주황색 실 이름은 전시 기간에 바뀐 명칭이며, 괄호 안은 원래 이름입니다.</footer>
</div>

<script src="config.js"></script>

  const sh=document.querySelector(`.room-shape[data-n="${n}"]`);
  if(sh){const h=sh.cloneNode(false);h.removeAttribute('tabindex');h.removeAttribute('role');h.removeAttribute('aria-label');h.setAttribute('class','hatch');h.setAttribute('fill','url(#hatch)');h.setAttribute('stroke','none');sh.after(h);}
  if(!noScroll)card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
function show(id){
  if(!FLOORS[id])id='f3'; current=id; const F=FLOORS[id];
  document.querySelectorAll('.floor-btn').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id?'true':'false'));
  document.getElementById('floorTitle').textContent=F.title;
  document.getElementById('floorSub').textContent=F.sub;
  draw(id); renderRooms(id);
  const used=new Set([...F.rooms.map(r=>r.cat),'core']);
  document.getElementById('legend').innerHTML=Object.entries(CAT).filter(([k])=>used.has(k)).map(([k,v])=>`<span><i style="background:${v.color}"></i>${v.label}</span>`).join('');
}

let lastFocus=null, sheetN=null, editing=false;
function openSheet(n){
  const F=FLOORS[current], rm=F.rooms.find(r=>r.n===n); if(!rm)return;
  sheetN=n; editing=false; lastFocus=lastFocus||document.activeElement;
  const I=info(current,rm);
  const photos=I.photos.length?I.photos.map(photoUrl):[null,null,null];
  let pi=0;
  const rooms=F.rooms, i=rooms.indexOf(rm), prev=rooms[(i-1+rooms.length)%rooms.length], next=rooms[(i+1)%rooms.length];
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="photo" id="galPhoto" style="background:${CAT[rm.cat].color}"><div id="galSlide" style="width:100%;height:100%;display:grid;place-items:center"></div>${photos.length>1?'<button class="gal-btn gal-prev" type="button" aria-label="이전 사진">‹</button><button class="gal-btn gal-next" type="button" aria-label="다음 사진">›</button><span class="gal-count" id="galCount"></span>':''}<span class="tag">${F.fl} · ${rm.n}</span><button class="sheet-close" type="button" aria-label="닫기">×</button></div>
  ${photos.length>1?`<div class="thumbs" id="galThumbs">${photos.map((p,k)=>`<button class="thumb" type="button" data-k="${k}" aria-label="사진 ${k+1}">${p?`<img src="${esc(p)}" alt="">`:k+1}</button>`).join('')}</div>`:''}
  <div class="sheet-body"><div class="title-row"><div><h3 id="sheetTitle" class="${rm.renamed?'renamed':''}">${esc(I.name)}</h3><div class="orig">${esc(rm.orig)}${rm.renamed?' · 전시 기간 명칭':''}</div></div>${EDIT.can?'<button class="edit-btn" type="button" id="editBtn">정보 수정</button>':''}</div>
  <span class="chip">${CAT[rm.cat].label}</span>
  <p>${esc(I.more)}</p>
  <dl class="facts"><dt>위치</dt><dd>${esc(I.where)}</dd><dt>용도</dt><dd>${esc(I.use)}</dd></dl>
  ${I.tips.length?`<ul class="tips">${I.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
  <div class="sheet-nav"><button type="button" data-go="${prev.n}">← ${esc(info(current,prev).name)}</button><button type="button" data-go="${next.n}">${esc(info(current,next).name)} →</button></div></div>`;

  const ph=`<div class="ph"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="33" r="10" fill="none" stroke="currentColor" stroke-width="3"/><rect x="22" y="8" width="20" height="8" rx="3" fill="currentColor"/></svg>`;
  const showPhoto=k=>{pi=(k+photos.length)%photos.length;const p=photos[pi];
    document.getElementById('galSlide').innerHTML=p?`<img src="${esc(p)}" alt="${esc(I.name)} 사진 ${pi+1}">`:`${ph}사진 ${pi+1} 준비 중입니다</div>`;
    const c=document.getElementById('galCount');if(c)c.textContent=`${pi+1} / ${photos.length}`;
    sh.querySelectorAll('.thumb').forEach(t=>t.setAttribute('aria-current',+t.dataset.k===pi?'true':'false'));};
  showPhoto(0);
  sh.querySelector('.gal-prev')?.addEventListener('click',()=>showPhoto(pi-1));
  sh.querySelector('.gal-next')?.addEventListener('click',()=>showPhoto(pi+1));
  sh.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>showPhoto(+t.dataset.k)));
  let sx=null;const gp=document.getElementById('galPhoto');
  gp.addEventListener('pointerdown',e=>{sx=e.clientX});
  gp.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40&&photos.length>1)showPhoto(pi+(dx<0?1:-1))});
  sh.onkeydown=e=>{if(editing||e.target.closest('.sheet-nav'))return;if(e.key==='ArrowRight')showPhoto(pi+1);if(e.key==='ArrowLeft')showPhoto(pi-1)};
  sh.querySelector('.sheet-close').addEventListener('click',closeSheet);
  sh.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const g=+b.dataset.go;focusRoom(g,true);openSheet(g)}));
  document.getElementById('editBtn')?.addEventListener('click',()=>openEditor(rm));
  document.getElementById('sheetBg').hidden=false;
  sh.scrollTop=0;
  sh.querySelector('.sheet-close').focus();
}

function openEditor(rm){
  editing=true;
  const key=current+'-'+rm.n, I=info(current,rm);
  let photos=[...I.photos];
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheet-body edit">
    <div class="title-row"><div><div class="eyebrow">시설 정보 수정</div><h3 id="sheetTitle">${esc(I.name)}</h3><div class="orig">${esc(rm.orig)}</div></div><button class="sheet-close static" type="button" aria-label="닫기">×</button></div>
    <label for="e-name">이름</label><input id="e-name" value="${esc(I.name)}" maxlength="40">
    <label for="e-desc">카드 설명 (짧게)</label><textarea id="e-desc" rows="2" maxlength="200">${esc(I.desc)}</textarea>
    <label for="e-more">자세한 설명</label><textarea id="e-more" rows="5" maxlength="2000">${esc(I.more)}</textarea>
    <div class="two"><div><label for="e-where">위치</label><input id="e-where" value="${esc(I.where)}" maxlength="120"></div><div><label for="e-use">용도</label><input id="e-use" value="${esc(I.use)}" maxlength="80"></div></div>
    <label for="e-tips">이용 안내 (한 줄에 하나씩)</label><textarea id="e-tips" rows="3" maxlength="1000">${esc(I.tips.join('\n'))}</textarea>
    <div class="ph-label">사진 <span id="e-count"></span></div>
    <div class="e-photos" id="e-photos"></div>
    <label class="upload" for="e-file">사진 추가 (여러 장 선택 가능)<input id="e-file" type="file" accept="image/*" multiple></label>
    <div class="e-status" id="e-status" role="status"></div>
    <div class="e-actions"><button type="button" class="ghost" id="e-cancel">취소</button><button type="button" class="primary" id="e-save">저장</button></div>
  </div>`;
  const st=document.getElementById('e-status');
  const drawPhotos=()=>{
    document.getElementById('e-count').textContent=photos.length?`${photos.length}장`:'';
    document.getElementById('e-photos').innerHTML=photos.length?photos.map((p,k)=>`<div class="e-ph"><img src="${esc(photoUrl(p))}" alt="사진 ${k+1}"><div class="e-ph-tools"><button type="button" data-mv="${k}" ${k===0?'disabled':''} aria-label="앞으로">←</button><button type="button" data-del="${k}" aria-label="삭제">삭제</button></div></div>`).join(''):'<div class="e-empty">아직 사진이 없습니다.</div>';
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{photos.splice(+b.dataset.del,1);drawPhotos()}));
    document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{const k=+b.dataset.mv;if(k>0){[photos[k-1],photos[k]]=[photos[k],photos[k-1]];drawPhotos()}}));
  };
  drawPhotos();
  const fileIn=document.getElementById('e-file');
  if(!EDIT.assets){fileIn.disabled=true;fileIn.parentElement.classList.add('off');fileIn.parentElement.firstChild.textContent='사진 업로드를 사용할 수 없습니다';}
  fileIn.addEventListener('change',async()=>{
    const files=[...fileIn.files]; if(!files.length)return;
    for(let k=0;k<files.length;k++){
      st.textContent=`사진 올리는 중… (${k+1}/${files.length})`;
      try{photos.push(await uploadPhoto(key,files[k]));drawPhotos();}
      catch(e){st.textContent=`${files[k].name}을(를) 올리지 못했습니다. ${'다시 시도해 주세요.'}`;fileIn.value='';return}
    }
    st.textContent='사진을 추가했습니다. 저장을 눌러야 반영됩니다.'; fileIn.value='';
  });
  const back=()=>openSheet(rm.n);
  sh.querySelector('.sheet-close').addEventListener('click',closeSheet);
  document.getElementById('e-cancel').addEventListener('click',back);
  document.getElementById('e-save').addEventListener('click',async e=>{
    const btn=e.currentTarget; btn.disabled=true; st.textContent='저장하는 중…';
    const v=id=>document.getElementById(id).value.trim();
    const body={name:v('e-name'),desc:v('e-desc'),more:v('e-more'),where:v('e-where'),use:v('e-use'),
      tips:v('e-tips').split('\n').map(t=>t.trim()).filter(Boolean),photos:photos.slice(0,30),floor:current,room:rm.n,updatedAt:new Date().toISOString()};
    try{const {error}=await SB.from('rooms').upsert({key,data:body,updated_at:body.updatedAt});if(error)throw error;OV[key]=body;renderRooms(current);draw(current);focusRoom(rm.n,true);openSheet(rm.n);}
    catch(err){btn.disabled=false;st.textContent=err&&(err.code==='42501'||/row-level security/i.test(err.message||''))?'수정 권한이 없는 계정입니다. 관리자에게 편집자 등록을 요청해 주세요.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'}
  });
  sh.scrollTop=0;
  document.getElementById('e-name').focus();
}
function closeSheet(){
  document.getElementById('sheetBg').hidden=true; sheetN=null; editing=false;
  if(lastFocus&&lastFocus.focus)lastFocus.focus(); lastFocus=null;
}
document.getElementById('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg'&&!editing)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetN!==null&&!editing)closeSheet()});

const dir=document.getElementById('dir');
['f3','f2','f1'].forEach(id=>{const F=FLOORS[id];const b=document.createElement('button');b.className='floor-btn';b.dataset.id=id;b.setAttribute('role','tab');
  b.innerHTML=`<span class="fl">${F.fl}</span><span class="sum"><strong>${F.title.split(' · ').slice(1).join(' · ')}</strong>${F.summary}</span>`;
  b.addEventListener('click',()=>{location.hash=id});dir.appendChild(b)});
const note=document.createElement('div');note.className='note';note.textContent='층을 누르면 안내도가 바뀝니다. 안내도의 실을 누르면 아래 설명 카드를 찾아 주고, ‘자세히 보기’를 누르면 사진과 자세한 설명이 열립니다.';dir.appendChild(note);
const en=document.createElement('div');en.className='edit-note';en.id='editNote';en.hidden=true;en.textContent='편집자로 로그인했습니다. ‘자세히 보기’에서 시설 정보를 수정할 수 있습니다.';dir.appendChild(en);
const ab=document.createElement('div');ab.className='auth-bar';ab.id='authBar';dir.appendChild(ab);
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'f3');

// ---- Supabase: shared edits for editors ----
const SB=(window.supabase&&window.SUPABASE_URL&&!/YOUR-PROJECT/.test(window.SUPABASE_URL))?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;
EDIT.assets=SB; EDIT.db=SB;
let USER=null;
function rerender(){renderRooms(current);draw(current);if(sheetN!==null&&!editing){const keep=lastFocus;openSheet(sheetN);lastFocus=keep}}
async function loadOverrides(){
  const {data,error}=await SB.from('rooms').select('key,data'); if(error)return;
  const next={}; data.forEach(r=>{next[r.key]=r.data}); OV=next; rerender();
}
function authUI(){
  const ab=document.getElementById('authBar'); if(!ab)return;
  document.getElementById('editNote').hidden=!EDIT.can;
  if(!USER){ab.innerHTML='<button type="button" class="link-btn" id="loginBtn">관리자 로그인</button>';document.getElementById('loginBtn').onclick=e=>{lastFocus=e.currentTarget;openLogin()};}
  else{ab.innerHTML=`<span>${esc(USER.email.replace(/@example\.com$/,''))} 로그인${EDIT.can?'':' · 편집 권한 없음'}</span><button type="button" class="link-btn" id="logoutBtn">로그아웃</button>`;document.getElementById('logoutBtn').onclick=async()=>{await SB.auth.signOut()};}
}
async function refreshAuth(session){
  USER=session?session.user:null; EDIT.can=false;
  if(USER){const {data}=await SB.rpc('is_editor');EDIT.can=data===true;}
  authUI(); rerender();
}
function openLogin(){
  editing=true; sheetN=-1;
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<form class="sheet-body edit" id="loginForm">
    <div class="title-row"><div><div class="eyebrow">편집자 전용</div><h3 id="sheetTitle">관리자 로그인</h3></div><button class="sheet-close static" type="button" aria-label="닫기">×</button></div>
    <label for="l-email">아이디</label><input id="l-email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="l-pw">비밀번호</label><input id="l-pw" type="password" autocomplete="current-password" required>
    <div class="e-status" id="l-status" role="status"></div>
    <div class="e-actions"><button type="button" class="ghost" id="l-cancel">취소</button><button type="submit" class="primary" id="l-go">로그인</button></div></form>`;
  const done=()=>{editing=false;closeSheet()};
  sh.querySelector('.sheet-close').onclick=done; document.getElementById('l-cancel').onclick=done;
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault(); const go=document.getElementById('l-go'), st=document.getElementById('l-status');
    go.disabled=true; st.textContent='확인하는 중…';
    const {error}=await SB.auth.signInWithPassword({email:(v=>v.includes('@')?v:v+'@example.com')(document.getElementById('l-email').value.trim().toLowerCase()),password:document.getElementById('l-pw').value});
    if(error){go.disabled=false;st.textContent='아이디 또는 비밀번호가 맞지 않습니다.';return}
    done();
  });
  document.getElementById('sheetBg').hidden=false;
  document.getElementById('l-email').focus();
}
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<1500000)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));}catch(e){return file}
}
async function uploadPhoto(key,file){
  const blob=await shrink(file); const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
  const path=`${key}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await SB.storage.from('room-photos').upload(path,blob,{contentType:blob.type,upsert:false});
  if(error)throw error;
  return SB.storage.from('room-photos').getPublicUrl(path).data.publicUrl;
}
if(SB){
  loadOverrides();
  SB.channel('rooms-live').on('postgres_changes',{event:'*',schema:'public',table:'rooms'},loadOverrides).subscribe();
  SB.auth.getSession().then(({data})=>refreshAuth(data.session));
  SB.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')refreshAuth(session)});
}
</script>
